<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="OpenCoding — Enterprise Multimodal Coding Agent Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="0.55" stop-color="#0C1220"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <rect x="0" y="0" width="1600" height="6" fill="url(#accent)"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="96" y="122" font-size="26" letter-spacing="6" fill="#7DD3FC" font-weight="600">OPEN SOURCE · ENTERPRISE AGENT HARNESS</text>

    <text x="92" y="228" font-size="96" font-weight="800" fill="#F8FAFC">Open<tspan fill="#A5B4FC">Coding</tspan></text>

    <text x="96" y="288" font-size="34" fill="#CBD5E1">A multi-modal Coding Agent Harness — kernel, tools, permissions,</text>
    <text x="96" y="332" font-size="34" fill="#CBD5E1">sandbox, memory, teams, goals, MCP, plugins, enterprise-grade by default.</text>

    <text x="96" y="384" font-size="22" fill="#94A3B8">Java 21 · Spring Boot · PostgreSQL · Redis · Electron · Vue · CLI + Desktop · 30+ harness systems</text>

    <g transform="translate(1120, 150)">
      <rect x="0" y="0" width="384" height="150" rx="18" fill="#0B1120" stroke="#1E293B" stroke-width="2"/>
      <circle cx="30" cy="30" r="6" fill="#F87171"/>
      <circle cx="52" cy="30" r="6" fill="#FBBF24"/>
      <circle cx="74" cy="30" r="6" fill="#34D399"/>
      <text x="28" y="76" font-size="22" fill="#64748B">$</text>
      <text x="50" y="76" font-size="22" fill="#E2E8F0" font-weight="600">oc run "ship the release"</text>
      <text x="28" y="112" font-size="20" fill="#34D399">plan → execute → verify → report</text>
      <text x="28" y="138" font-size="20" fill="#64748B">sandboxed · audited · resumable</text>
    </g>
  </g>
</svg>
